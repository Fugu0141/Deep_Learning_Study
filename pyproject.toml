[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-studio"
version = "0.1.0"
description = "A local, visual GPT learning studio built with PyTorch and PySide6"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Fugu0141"}]
dependencies = [
  "torch>=2.2",
  "PySide6>=6.7",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
deep-learning-studio = "deep_learning_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["deep_learning_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001"] # GUI/worker boundaries must surface unexpected runtime failures.
